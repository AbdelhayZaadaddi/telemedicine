# Base PostgreSQL de développement pour le projet Télémédecine.
# Démarrage : docker compose up -d
services:
  postgres:
    image: postgres:17
    container_name: telemedicine-postgres
    environment:
      POSTGRES_DB: telemedicine
      POSTGRES_USER: telemedicine
      POSTGRES_PASSWORD: telemedicine
    ports:
      - "5432:5432"
    volumes:
      - telemedicine-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemedicine -d telemedicine"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  telemedicine-data:
